<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>یاریا بلۆکان (چالنجا ئۆنلاین)</title>
    <!-- پەرتووکا PeerJS بۆ پەیوەندیا ڕاستەوخۆ -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #12131C, #1A1B29);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* بەشا ئۆنلاین و بەستنا هەڤالی */
        #online-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
            width: 320px;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .my-id-container {
            font-size: 13px;
            margin-bottom: 8px;
            color: #2ed573;
            font-weight: bold;
        }
        .connect-inputs {
            display: flex;
            gap: 6px;
        }
        .connect-inputs input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .connect-inputs button {
            padding: 6px 12px;
            font-size: 12px;
            background: #1e90ff;
            border-radius: 8px;
            box-shadow: none;
        }

        #rgb-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            width: 320px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }
        .slider-group input[type="range"] {
            flex-grow: 1;
            margin: 0 8px;
            cursor: pointer;
        }
        #red-slider { accent-color: #ff4757; }
        #green-slider { accent-color: #2ed573; }
        #blue-slider { accent-color: #1e90ff; }

        #game-container {
            position: relative;
            width: 320px;
            height: 380px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            touch-action: manipulation;
        }
        
        .score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .peer-score-board {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            background: rgba(30, 144, 255, 0.4);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #stack {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
        .block {
            position: absolute;
            height: 25px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #game-over-screen.hidden {
            display: none;
        }
        #game-over-screen h1 {
            font-size: 26px;
            color: #ff4757;
            margin-bottom: 8px;
        }
        #game-over-screen p {
            font-size: 15px;
            margin-bottom: 15px;
        }
        button {
            padding: 8px 20px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(45deg, #2ed573, #1e90ff);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
    </style>
</head>
<body>

    <!-- بەشا پەیوەندییا ئۆنلاین -->
    <div id="online-box">
        <div class="my-id-container">ID-یا تە: <span id="my-peer-id">دێ لۆد بیت...</span></div>
        <div class="connect-inputs">
            <input type="text" id="peer-id-input" placeholder="ID-یا هەڤالێ خۆ بنڤێسە">
            <button onclick="connectToFriend()">بەستن</button>
        </div>
    </div>

    <!-- بەشا ڕەنگی RGB -->
    <div id="rgb-controls">
        <div class="slider-group">
            <label style="color: #ff4757;">R:</label>
            <input type="range" id="red-slider" min="0" max="255" value="255">
        </div>
        <div class="slider-group">
            <label style="color: #2ed573;">G:</label>
            <input type="range" id="green-slider" min="0" max="255" value="0">
        </div>
        <div class="slider-group">
            <label style="color: #1e90ff;">B:</label>
            <input type="range" id="blue-slider" min="0" max="255" value="100">
        </div>
    </div>

    <div id="game-container">
        <div class="score-board">تە: <span id="score">0</span></div>
        <div class="peer-score-board">هەڤال: <span id="peer-score">0</span></div>
        <div id="stack"></div>

        <div id="game-over-screen" class="hidden">
            <h1>یاری دووماهی هات!</h1>
            <p>خاڵێن تە: <span id="final-score">0</span></p>
            <button onclick="startGame()">دیسان دەستپێبکە</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const stackContainer = document.getElementById('stack');
        const scoreDisplay = document.getElementById('score');
        const peerScoreDisplay = document.getElementById('peer-score');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over-screen');

        const redSlider = document.getElementById('red-slider');
        const greenSlider = document.getElementById('green-slider');
        const blueSlider = document.getElementById('blue-slider');

        const myPeerIdEl = document.getElementById('my-peer-id');
        const peerIdInput = document.getElementById('peer-id-input');

        const CONTAINER_WIDTH = 320;
        const BLOCK_HEIGHT = 25;
        
        let stack = [];
        let currentBlock = null;
        let direction = 1;
        let speed = 2.5;
        let level = 0;
        let gameActive = false;
        let animationFrameId = null;

        // کەمپینا ئۆنلاین (PeerJS)
        let peer = null;
        let conn = null;

        function initPeer() {
            // دروستکرنا ID ژمارەییا کورت
            const randomId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(randomId);

            peer.on('open', (id) => {
                myPeerIdEl.innerText = id;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function connectToFriend() {
            const friendId = peerIdInput.value.trim();
            if (friendId) {
                conn = peer.connect(friendId);
                setupConnection();
            }
        }

        function setupConnection() {
            conn.on('open', () => {
                alert('پەیوەندی دگەل هەڤالێ تە ب سەرکەفتن هاتە بەستن!');
            });

            conn.on('data', (data) => {
                if (data.type === 'score') {
                    peerScoreDisplay.innerText = data.score;
                }
            });
        }

        function sendScoreToFriend(currentScore) {
            if (conn && conn.open) {
                conn.send({ type: 'score', score: currentScore });
            }
        }

        function getSelectedRGB(lvl) {
            let r = parseInt(redSlider.value);
            let g = parseInt(greenSlider.value);
            let b = parseInt(blueSlider.value);

            const factor = 1 - ((lvl % 10) * 0.04);
            r = Math.max(0, Math.floor(r * factor));
            g = Math.max(0, Math.floor(g * factor));
            b = Math.max(0, Math.floor(b * factor));

            return `rgb(${r}, ${g}, ${b})`;
        }

        function startGame() {
            stackContainer.innerHTML = '';
            stackContainer.style.transform = 'translateY(0px)';
            stack = [];
            level = 0;
            speed = 2.5; 
            scoreDisplay.innerText = level;
            sendScoreToFriend(0);
            gameOverScreen.classList.add('hidden');
            gameActive = true;

            const baseBlock = {
                x: (CONTAINER_WIDTH - 180) / 2,
                y: 0,
                width: 180,
                color: getSelectedRGB(0)
            };
            stack.push(baseBlock);
            drawBlock(baseBlock);

            spawnNextBlock();
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function spawnNextBlock() {
            level++;
            scoreDisplay.innerText = level - 1;
            sendScoreToFriend(level - 1);
            
            speed += 0.45; 

            const previousBlock = stack[stack.length - 1];
            currentBlock = {
                x: 0,
                y: level * BLOCK_HEIGHT,
                width: previousBlock.width,
                color: getSelectedRGB(level),
                element: document.createElement('div')
            };

            currentBlock.element.className = 'block';
            currentBlock.element.style.width = currentBlock.width + 'px';
            currentBlock.element.style.bottom = currentBlock.y + 'px';
            currentBlock.element.style.backgroundColor = currentBlock.color;
            currentBlock.element.style.left = currentBlock.x + 'px';

            stackContainer.appendChild(currentBlock.element);
            direction = 1;
        }

        function gameLoop() {
            if (!gameActive) return;

            currentBlock.x += speed * direction;

            if (currentBlock.x + currentBlock.width >= CONTAINER_WIDTH) {
                direction = -1;
            } else if (currentBlock.x <= 0) {
                direction = 1;
            }

            currentBlock.element.style.left = currentBlock.x + 'px';

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function placeBlock() {
            if (!gameActive || !currentBlock) return;

            const previousBlock = stack[stack.length - 1];
            const difference = currentBlock.x - previousBlock.x;

            if (Math.abs(difference) >= currentBlock.width) {
                endGame();
                return;
            }

            if (difference > 0) {
                currentBlock.width -= difference;
            } else {
                currentBlock.width += difference;
                currentBlock.x = previousBlock.x;
            }

            currentBlock.element.style.width = currentBlock.width + 'px';
            currentBlock.element.style.left = currentBlock.x + 'px';

            stack.push({
                x: currentBlock.x,
                y: currentBlock.y,
                width: currentBlock.width,
                color: currentBlock.color
            });

            if (level * BLOCK_HEIGHT > 180) {
                stackContainer.style.transform = `translateY(-${(level * BLOCK_HEIGHT) - 180}px)`;
                stackContainer.style.transition = 'transform 0.3s ease';
            }

            spawnNextBlock();
        }

        function drawBlock(blockData) {
            const el = document.createElement('div');
            el.className = 'block';
            el.style.width = blockData.width + 'px';
            el.style.bottom = blockData.y + 'px';
            el.style.backgroundColor = blockData.color;
            el.style.left = blockData.x + 'px';
            stackContainer.appendChild(el);
        }

        function endGame() {
            gameActive = false;
            finalScoreDisplay.innerText = level - 1;
            gameOverScreen.classList.remove('hidden');
        }

        container.addEventListener('click', () => {
            if (gameActive) placeBlock();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameActive && !gameOverScreen.classList.contains('hidden')) {
                    startGame();
                } else {
                    placeBlock();
                }
            }
        });

        initPeer();
        startGame();
    </script>
</body>
</html>
