<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - یارییا مارێ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            color: #4CAF50;
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 15px;
        }
        #game-board {
            border: 4px solid #4CAF50;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
            max-width: 90vw;
            max-height: 50vh;
        }
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #555;
            border-radius: 10px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            active-background-color: #4CAF50;
        }
        .btn:active {
            background-color: #4CAF50;
        }
        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <h1>یارییا مارێ</h1>
    <div id="score-board">خاڵ: <span id="score">0</span></div>
    
    <canvas id="game-board" width="400" height="400"></canvas>

    <!-- دوگمەیێن مۆبایلێ -->
    <div class="controls">
        <button class="btn" id="up">⬆️</button>
        <button class="btn" id="left">⬅️</button>
        <button class="btn" id="down">⬇️</button>
        <button class="btn" id="right">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval;

        function main() {
            if (hasGameEnded()) {
                alert("یاری ب دوماهی هات! خاڵێن تە: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4CAF50";
            snake.forEach((part, index) => {
                if (index === 0) ctx.fillStyle = "#8BC34A"; // سەرێ مارێ
                else ctx.fillStyle = "#4CAF50";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function drawFood() {
            ctx.fillStyle = "#FF5722";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateFood();
        }

        function changeDirection(dir) {
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -1; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
            if (dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
            if (dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
        }

        // کۆنترۆڵا کیبۆردێ
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp") changeDirection('UP');
            if (event.key === "ArrowDown") changeDirection('DOWN');
            if (event.key === "ArrowLeft") changeDirection('LEFT');
            if (event.key === "ArrowRight") changeDirection('RIGHT');
        });

        // کۆنترۆڵا دوگمەیێن مۆبایلێ
        document.getElementById("up").addEventListener("click", () => changeDirection('UP'));
        document.getElementById("down").addEventListener("click", () => changeDirection('DOWN'));
        document.getElementById("left").addEventListener("click", () => changeDirection('LEFT'));
        document.getElementById("right").addEventListener("click", () => changeDirection('RIGHT'));

        generateFood();
        setInterval(main, 100);
    </script>
</body>
</html>
